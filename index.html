<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF → Editable DXF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="eyebrow">DRAFTER TOOLBOX</div>
      <h1>PDF → Editable DXF</h1>
      <p class="subtitle">Convert vector PDF drawings into editable DXF files.</p>

      <div id="dropZone" class="drop-zone">
        <div class="upload-icon">↑</div>
        <div class="drop-title">DROP PDF HERE</div>
        <div class="drop-or">or</div>
        <button id="browseBtn" class="browse-btn" type="button">Browse File</button>
        <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
        <div id="fileName" class="file-name"></div>
      </div>

      <div id="sheetArea" class="sheet-area hidden">
        <label for="pageSelect">Sheet / Page</label>
        <select id="pageSelect"></select>
      </div>

      <button id="convertBtn" class="convert-btn" type="button" disabled>
        CONVERT TO DXF
      </button>

      <div id="statusArea" class="status hidden">
        <div class="status-row">
          <span id="statusText">Preparing...</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <a id="downloadBtn" class="download-btn hidden" href="#" download>
        DOWNLOAD DXF
      </a>

      <div id="message" class="message"></div>

      <div class="note">
        V1 supports vector PDFs. Scanned/image-only PDFs are not supported yet.
      </div>
    </section>

    <footer>PDF2DXF V1</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
